[project]
name = "portfolio-top-movers"
version = "1.0.0"
description = "SGX Top Movers Pre-Sales Report Generator - AI-powered daily gainers/decliners analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.26.0",
    "aiohttp>=3.9.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.0",
    "requests>=2.31.0",
    "google-generativeai>=0.3.0",
    "openai>=1.10.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services", "config"]

[tool.pytest.ini_options]
testpaths = ["tests"]
